- id: REQ-TRV-034
  title: AI requests and replies are logged only as the agreed retention rules allow
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/ai-usage.spec.ts
    - tests/api/ai-records.http.spec.ts
    - tests/unit/ai-record-retention-schedule.test.ts
    - tests/unit/ai-record-service.test.ts
    - tests/unit/plan-service.test.ts
  version: 1
  source: BRD v1.0 §29 ("logged only according to the application's privacy and retention requirements"); §30 FR-04; clarified by client confirmation relayed in session 2026-09-23
  rationale: >-
    The BRD refers to privacy and retention requirements that it does not state. The
    client has since set them: AI request and reply text is kept for 30 days for
    Administrator review only, then deleted, while token counts and cost are kept
    without text for the dashboard.
  acceptance:
    - given: A Plan generated today
      when: An Administrator opens the stored AI requests screen
      then: The text sent to and returned by the AI for that generation is shown
    - given: An AI request and reply stored 31 days ago
      when: The stored AI records are inspected
      then: >-
        Neither the request text nor the reply text remains, while its token counts and
        cost do remain
    - given: A logged-in Traveler who is not an Administrator
      when: They request the stored AI requests endpoint
      then: The response status is 403 and carries no AI text
    - given: A logged-in Administrator
      when: They view a stored AI request
      then: >-
        An audit log entry is recorded naming the Administrator and the request viewed
  depends_on: [REQ-TRV-026]
  belts: [A]

