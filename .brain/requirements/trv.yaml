- id: REQ-TRV-062
  title: A Traveler can rate a Trip's Plan and add a comment
  module: TRV
  priority: should
  status: agreed
  version: 1
  source: BRD v1.0 §15 ("Users should be able to rate the generated itinerary and provide comments"); §30 FR-10; §27 ("The user can submit feedback"); clarified by client confirmation relayed in session 2026-09-23
  acceptance:
    - given: A Traveler with a Trip that has a Plan and whose end date has not passed
      when: They submit rating 4 and the comment "Day 2 too busy"
      then: The feedback is accepted and a confirmation is shown
    - given: A Trip with status "Draft" and no Plan
      when: Its owner submits feedback
      then: The feedback is refused and none is stored
    - given: A Trip whose feedback has rating 2
      when: Its owner submits rating 5
      then: The Trip has one feedback entry, with rating 5
    - given: A Trip with a Plan
      when: Its owner submits rating 0 or rating 6
      then: The feedback is refused and the rating is named as the invalid field
    - given: A Trip with a Plan
      when: Its owner submits a comment with no rating
      then: The feedback is refused and the rating is named as the invalid field
    - given: A Trip with a Plan
      when: Its owner submits rating 3 with a 1,001-character comment
      then: The feedback is refused and the comment is named as the invalid field
    - given: A Trip with a Plan
      when: Its owner submits rating 3 with a 1,000-character comment
      then: The feedback is accepted
    - given: A Trip with a Plan
      when: Its owner submits rating 3 with no comment
      then: The feedback is accepted
    - given: A Trip whose current Plan version is 3
      when: Its owner submits feedback
      then: The stored feedback records Plan version 3
  depends_on: [REQ-TRV-026]
  belts: [A, B, C]

