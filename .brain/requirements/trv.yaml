- id: REQ-TRV-068
  title: Only Administrators can open the admin dashboard and admin functions
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/admin-destinations.spec.ts
    - tests/api/admin-access.http.spec.ts
    - tests/unit/admin-access.test.ts
    - tests/unit/admin-account-service.test.ts
  version: 2
  history:
    - version: 1
      agreed: 2026-09-23
      superseded_by: 2
      summary: >-
        v1 also held the criterion that a Traveler asking for a sixth Plan generation in
        a day, with the limit set to 5, is refused with a message stating when the limit
        resets. Moved unchanged to REQ-TRV-091 by CHG-0001, because it needs Plan
        generation (slice 4) and could not be tested in slice 2.
  source: BRD v1.0 §18; §4; §22 Security; clarified by client confirmation relayed in session 2026-09-23; re-agreed after CHG-0001 by developer confirmation 2026-09-24
  acceptance:
    - given: A logged-in Traveler who is not an Administrator
      when: They request any admin API endpoint
      then: The response status is 403
    - given: A logged-in Administrator
      when: They open the admin dashboard
      then: The dashboard is shown
    - given: A newly installed application with no Administrator
      when: The installation seed step is run for admin@example.com
      then: admin@example.com can log in and open the admin dashboard
    - given: An Administrator A and a Traveler T whose email address is confirmed
      when: A promotes T to Administrator and confirms
      then: >-
        T can open the admin dashboard, and an audit log entry records A promoting T
    - given: An Administrator A and a Traveler T whose email address is not confirmed
      when: A tries to promote T to Administrator
      then: The promotion is refused and T's admin API requests still return 403
    - given: Administrators A and B
      when: A demotes B and confirms
      then: >-
        B's admin API requests return 403, and an audit log entry records A demoting B
    - given: A is the only Administrator
      when: A tries to demote themselves
      then: The demotion is refused and A remains an Administrator
    - given: A logged-in Administrator
      when: They open the admin functions
      then: >-
        The functions offered are users, Destinations, feedback, notification settings
        and AI usage limits, and no editing of site text or email templates is offered
  depends_on: [REQ-TRV-002]
  belts: [A, B, C]

