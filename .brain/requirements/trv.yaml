- id: REQ-TRV-018
  title: Reopening a saved Trip shows its Plan exactly as last saved
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/save-reopen.spec.ts
    - tests/api/plan-versions.http.spec.ts
    - tests/unit/plan-service.test.ts
    - tests/unit/plan-store.test.ts
    - tests/unit/plan-view-state.test.ts
    - tests/unit/scripted-ai-service.test.ts
  version: 1
  source: BRD v1.0 §13 ("reopen them later"); §30 FR-08; §27 ("The user can save and reopen a trip"); clarified by client confirmation relayed in session 2026-09-23
  acceptance:
    - given: A saved Trip whose Plan has 8 Days and a known set of Activities
      when: The Traveler logs out, logs in and opens the Trip
      then: The same 8 Days and the same Activities are shown
    - given: A Trip whose Plan was generated and then regenerated
      when: The Traveler opens its version list and restores the first version
      then: >-
        The Plan shown is the first version's Plan, and the version list holds three
        versions with none removed
    - given: A Trip that already has 10 Plan versions
      when: An 11th version is created
      then: The version list holds 10 versions and the oldest is no longer listed
  depends_on: [REQ-TRV-017]
  belts: [A, B, C]

- id: REQ-TRV-019
  title: Saved Trips persist across application restarts
  module: TRV
  priority: must
  status: verified
  verified_by:
    - tests/api/plan-versions.http.spec.ts
    - tests/unit/plan-store.test.ts
  version: 1
  source: BRD v1.0 §22 Reliability ("saved trips must persist across application restarts"); §30 FR-08
  acceptance:
    - given: A saved Trip with a Plan
      when: The application is stopped and started again and the owner requests the Trip
      then: The Trip and its Plan are returned unchanged
  depends_on: [REQ-TRV-017]
  belts: [A, C]

# ---------------------------------------------------------------------------
# Travel preferences (FR-03, §7, §12, §25 Release 2)
# ---------------------------------------------------------------------------
- id: REQ-TRV-020
  title: A Traveler can set a Trip's travel style from the eight listed styles
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/trip-preferences.spec.ts
    - tests/api/trip-preferences.http.spec.ts
    - tests/unit/trip-form-state.test.ts
    - tests/unit/trip-preferences.test.ts
    - tests/unit/trip-service.test.ts
  version: 1
  source: BRD v1.0 §7; §30 FR-03; §25 Release 2; clarified by client confirmation relayed in session 2026-09-23
