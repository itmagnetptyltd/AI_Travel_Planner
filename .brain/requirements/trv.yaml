    - tests/unit/plan-store.test.ts
    - tests/unit/plan-view-state.test.ts
  version: 1
  source: BRD v1.0 §13 ("Users can save generated trips"); §30 FR-08; §27; §25 Release 1; clarified by client confirmation relayed in session 2026-09-23
