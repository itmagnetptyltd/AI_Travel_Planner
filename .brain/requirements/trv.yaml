- id: REQ-TRV-026
  title: The AI generates a Plan with one Day for every date from the Trip's start date to its end date
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/plan-generation.spec.ts
    - tests/api/plans.http.spec.ts
    - tests/unit/config.test.ts
    - tests/unit/plan-prompt.test.ts
    - tests/unit/plan-reply.test.ts
    - tests/unit/plan-service.test.ts
    - tests/unit/plan-view-state.test.ts
    - tests/unit/scripted-ai-service.test.ts
  version: 1
  source: BRD v1.0 §8 ("generates a day-by-day itinerary"); §30 FR-04; §27; §25 Release 1; clarified by client confirmation relayed in session 2026-09-23
  acceptance:
    - given: A Trip from 2026-10-10 to 2026-10-17
      when: The Traveler asks for a Plan to be generated
      then: The Plan shown has 8 Days, dated 2026-10-10 through 2026-10-17 in order
    - given: A Trip with no Plan
      when: Generation completes
      then: Every Day in the Plan holds at least one Activity
    - given: >-
        A Trip with Destination, dates, 2 adults, budget and currency but no
        preferences, and an AI test double
      when: A Plan is generated
      then: >-
        The test double receives one request carrying the Destination, the dates, the
        number of adults and children and the budget, and the Plan shown is the one it
        returned
    - given: A Trip from 2026-10-01 to 2026-10-14
      when: The Traveler asks for a Plan to be generated
      then: The Plan shown has 14 Days, dated 2026-10-01 through 2026-10-14 in order
    - given: >-
        An AI test double returning a Day with five Activities starting at 19:00, 08:00,
        13:00, 10:30 and 15:00
      when: The Plan is generated
      then: >-
        That Day shows all five Activities, ordered 08:00, 10:30, 13:00, 15:00, 19:00
    - given: An AI test double
      when: A Plan is generated
      then: The request asks for 3 to 5 Activities per Day
    - given: >-
        A Destination Kyoto with a description, popular activities and travel
        information, and an AI test double
      when: A Plan for a Trip to Kyoto is generated
      then: >-
        The request contains Kyoto's description, popular activities and travel
        information in a section marked as reference data, not instructions
    - given: >-
        A Destination whose description is longer than the configured maximum length,
        and an AI test double
      when: A Plan for a Trip to it is generated
      then: The description in the request is cut to the configured maximum length
    - given: >-
        A Traveler who has made 20 Plan generations or regenerations today, and an AI
        test double
      when: They ask for another Plan to be generated
      then: >-
        The request is refused with a message stating when the limit resets, and the
        test double receives no request
    - given: A Traveler who reached 20 Plan generations yesterday
      when: They ask for a Plan to be generated today
      then: The Plan is generated
    - given: The daily generation limit configured as 2
      when: A Traveler asks for a third Plan generation on the same day
      then: The request is refused with a message stating when the limit resets
    - given: The application as served to a browser
      when: Every page and script it serves is searched for the AI service key
      then: The key is not found in any of them
    - given: >-
        A Traveler generating a Plan in the browser while its network traffic is
        recorded
      when: Generation completes
      then: >-
        The browser has sent no request to the AI provider; the AI was called only by
        the server
  depends_on: [REQ-TRV-011]
  belts: [A, B, C]

