# .brain/requirements/trv.yaml
#
# Module TRV — AI Travel Planner. Decomposed from BRD v1.0
# (.brain/requirements/BRIEF.md; source file .brain/docs/ref/001-AI_Travel_Planner_BRD.pdf).
# Client answers of 2026-09-23 applied. Open questions are in AMBIGUITIES.md, word for word.
#
# Priority is taken from the client's own matrix (BRD v1.0 §30): High -> must,
# Medium -> should, Future/Medium -> could. Where a capability is absent from §30,
# the anchor used is named in `source`, and the gap is raised as a question.

# ---------------------------------------------------------------------------
# Accounts and access (FR-01, §17, §22 Security)
# ---------------------------------------------------------------------------
- id: REQ-TRV-001
  title: A visitor can register a Traveler account with an email address and password
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/accounts.spec.ts
    - tests/api/registration.http.spec.ts
    - tests/unit/breached-password-list.test.ts
    - tests/unit/email-token-policy.test.ts
    - tests/unit/password-hasher.test.ts
    - tests/unit/password-policy.test.ts
  version: 1
  source: BRD v1.0 §17; §30 FR-01; §27; §25 Release 1; clarified by client confirmation relayed in session 2026-09-23
  acceptance:
    - given: No account exists for the email address traveler@example.com
      when: A visitor registers with that email address and a password
      then: A Traveler account exists for traveler@example.com and can be used to log in
    - given: An account already exists for traveler@example.com
      when: A visitor registers again with traveler@example.com
      then: Registration is refused with a message that the email address is already registered
    - given: No account exists for new@example.com
      when: A visitor registers with new@example.com and an 11-character password
      then: >-
        Registration is refused, the password is named as the invalid field, and no
        account exists for new@example.com
    - given: No account exists for new@example.com
      when: >-
        A visitor registers with a 12-character password made only of lowercase letters
        that is not on the known-breached password list
      then: The account is created; no character-mix rule is applied
    - given: No account exists for new@example.com
      when: >-
        A visitor registers with a 128-character password that is not on the
        known-breached password list
      then: The account is created
    - given: No account exists for new@example.com
      when: A visitor registers with a 129-character password
      then: Registration is refused and the password is named as the invalid field
    - given: No account exists for new@example.com
      when: >-
        A visitor registers with a password of 12 or more characters that appears on the
        known-breached password list
      then: Registration is refused and the password is named as the invalid field
    - given: A Traveler registered with the password P
      when: The stored account record is read
      then: >-
        The stored password field is an Argon2id or bcrypt hash that verifies against P
    - given: >-
        No account exists for traveler@example.com, and a captured outbound mail service
      when: A visitor registers with traveler@example.com
      then: >-
        One confirmation email containing a confirmation link is captured, addressed to
        traveler@example.com
    - given: A registered account whose email address has not been confirmed
      when: Its owner tries to create a Trip
      then: >-
        The Trip is not created and a message asks them to confirm their email address
        first
    - given: A confirmation link issued 23 hours ago
      when: It is opened
      then: The account is confirmed and its owner can then create a Trip
    - given: A confirmation link issued 25 hours ago
      when: It is opened
      then: It is refused as expired and the account remains unconfirmed
    - given: A visitor on the registration page
      when: The page is shown
      then: >-
        A privacy notice is shown stating that Trip details are sent to a third-party AI
        service, which may process them outside Australia
  belts: [A, B, C]

- id: REQ-TRV-002
  title: A registered Traveler can log in with their email address and password
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/accounts.spec.ts
    - tests/api/password-reset.http.spec.ts
    - tests/api/sessions.http.spec.ts
    - tests/unit/email-token-policy.test.ts
  version: 1
  source: BRD v1.0 §17; §30 FR-01; §5; §25 Release 1; clarified by client confirmation relayed in session 2026-09-23
  acceptance:
    - given: A registered Traveler
      when: They log in with their email address and correct password
      then: They are shown their list of Trips as a logged-in Traveler
    - given: A registered Traveler, and a captured outbound mail service
      when: They request a password reset for their email address
      then: >-
        One password-reset email containing a reset link is captured, addressed to them
    - given: A password-reset link issued 50 minutes ago
      when: The Traveler uses it to set a new password
      then: >-
        They can log in with the new password and can no longer log in with the old one
    - given: A password-reset link that has already been used once
      when: It is used again to set a password
      then: It is refused and the password is unchanged
    - given: A password-reset link issued 61 minutes ago
      when: It is used to set a new password
      then: It is refused as expired and the password is unchanged
  depends_on: [REQ-TRV-001]
  belts: [A, B, C]

- id: REQ-TRV-003
  title: A login attempt with an incorrect password is refused
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/accounts.spec.ts
    - tests/api/sessions.http.spec.ts
    - tests/unit/account-service.test.ts
  version: 1
  source: BRD v1.0 §17; §22 Security; §30 FR-01
  acceptance:
    - given: A registered Traveler
      when: A login is attempted with their email address and a wrong password
      then: No logged-in session is created and a login error message is shown
  depends_on: [REQ-TRV-001]
  belts: [A, B, C]

- id: REQ-TRV-004
  title: A logged-in Traveler can log out, ending their session
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/accounts.spec.ts
    - tests/api/sessions.http.spec.ts
    - tests/unit/session-service.test.ts
  version: 1
  source: BRD v1.0 §17; §30 FR-01
  acceptance:
    - given: A logged-in Traveler
      when: They log out and then request their list of Trips
      then: The request is refused as not logged in
  depends_on: [REQ-TRV-002]
  belts: [A, B, C]

- id: REQ-TRV-005
  title: Trip pages and Trip API endpoints refuse callers who are not logged in
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/accounts.spec.ts
    - tests/api/sessions.http.spec.ts
    - tests/unit/require-traveler.test.ts
  version: 1
  source: BRD v1.0 §22 Security ("protect accounts, passwords, APIs"); §5 (journey begins with Register/Login)
  acceptance:
    - given: A caller with no logged-in session
      when: They request any Trip API endpoint
      then: The response status is 401
    - given: A browser with no logged-in session
      when: It opens a Trip page
      then: The login page is shown instead of the Trip
  depends_on: [REQ-TRV-002]
  belts: [A, B, C]

- id: REQ-TRV-006
  title: A Traveler's password is never stored in the form it was entered
  module: TRV
  priority: must
  status: verified
  verified_by:
    - tests/unit/account-service.test.ts
  version: 1
  source: BRD v1.0 §22 Security ("protect accounts, passwords")
  acceptance:
    - given: A Traveler registered with the password P
      when: The stored account record is read
      then: No stored field of the account contains the value P
  depends_on: [REQ-TRV-001]
  belts: [A]

- id: REQ-TRV-007
  title: A Traveler can see and change only their own Trips
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/trips.spec.ts
    - tests/api/trip-access.http.spec.ts
    - tests/unit/trip-service.test.ts
  version: 2
  history:
    - version: 1
      agreed: 2026-09-23
      superseded_by: 2
      summary: >-
        v1 also held the criterion that an Administrator requesting a Trip that has a
        Plan and no feedback receives its Destination, dates, number of travelers,
        budget and status, and no Days or Activities. Moved unchanged to REQ-TRV-101 by
        CHG-0002, because it needs a saved Plan and the admin view of Trips (slices 5
        and 12), which slice 3 does not build.
  source: BRD v1.0 §22 Security; §30 FR-02; clarified by client confirmation relayed in session 2026-09-23; re-agreed after CHG-0002 by developer confirmation 2026-09-25
  acceptance:
    - given: Traveler X owns a Trip and Traveler Y is logged in
      when: Y requests X's Trip by its identifier
      then: The response is 404 and carries no Trip fields
    - given: Traveler X owns a Trip and Traveler Y is logged in
      when: Y submits a change to X's Trip
      then: The request is refused and X's Trip is unchanged
    - given: Travelers X and Y each own Trips
      when: Y opens their list of Trips
      then: None of X's Trips appears in the list
    - given: >-
        Traveler X owns a Trip, and the only roles that exist are Traveler and
        Administrator
      when: An account that is neither X nor an Administrator requests X's Trip
      then: The response is 404 and carries no Trip fields
  depends_on: [REQ-TRV-011]
  belts: [A, B, C]

- id: REQ-TRV-008
  title: A Traveler's profile information is never returned to another Traveler
  module: TRV
  priority: must
  status: agreed
  version: 1
  source: 'BRD v1.0 §22 Security ("protect ... personal information"); clarified by client confirmation relayed in session 2026-09-23 (privacy answer in ANSWERS.md); developer decision 2026-09-25: that answer adds no behaviour to this requirement, so it is agreed as written'
  acceptance:
    - given: Traveler X has a profile and Traveler Y is logged in
      when: Y requests X's profile by X's identifier
      then: The response is 404 and carries none of X's profile fields
  depends_on: [REQ-TRV-009]
  belts: [A, C]

- id: REQ-TRV-009
  title: A logged-in Traveler can update their profile
  module: TRV
  priority: should
  status: verified
  verified_by:
    - e2e/accounts.spec.ts
    - tests/api/profile.http.spec.ts
    - tests/unit/account-service.test.ts
  version: 1
  source: BRD v1.0 §17 (not in §30 matrix or §25 roadmap; priority raised as a question); clarified by client confirmation relayed in session 2026-09-23, §25 Release 1 (per client)
  acceptance:
    - given: A logged-in Traveler
      when: They change a profile detail and save
      then: The changed value is shown when they next open their profile
  depends_on: [REQ-TRV-002]
  belts: [A, B, C]

- id: REQ-TRV-010
  title: A Traveler can record a preferred currency, default travel style and food preference on their profile
  module: TRV
  priority: should
  status: verified
  verified_by:
    - e2e/accounts.spec.ts
    - tests/api/profile.http.spec.ts
    - tests/unit/account-service.test.ts
    - tests/unit/profile-options.test.ts
  version: 1
  source: BRD v1.0 §17 ("Profile preferences may include preferred currency, default travel style and dietary preference"); clarified by client confirmation relayed in session 2026-09-23, §25 Release 1 (per client)
  acceptance:
    - given: A logged-in Traveler
      when: They set preferred currency USD, default travel style Family and food preference Vegetarian and save
      then: Their profile shows USD, Family and Vegetarian when reopened
    - given: >-
        A Traveler whose profile has preferred currency USD, default travel style Family
        and food preference Vegetarian
      when: They start creating a new Trip
      then: >-
        The Trip form is pre-filled with currency USD, travel style Family and food
        preference Vegetarian
    - given: A saved Trip with travel style Family
      when: Its owner changes their profile's default travel style to Luxury
      then: The saved Trip and its Plan still show travel style Family
    - given: A logged-in Traveler editing their profile
      when: They open the preferred currency choice
      then: Exactly AUD, USD, EUR, GBP, JPY, SGD, NZD and BDT are offered
  depends_on: [REQ-TRV-009]
  belts: [A, B, C]

# ---------------------------------------------------------------------------
# Trips (FR-02, FR-08, §6, §13, §22 Reliability)
# ---------------------------------------------------------------------------
- id: REQ-TRV-011
  title: A Traveler can create a Trip with name, Destination, dates, travelers, budget and currency
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/trips.spec.ts
    - tests/api/trips.http.spec.ts
    - tests/unit/trip-schemas.test.ts
    - tests/unit/trip-service.test.ts
  version: 2
  history:
    - version: 1
      agreed: 2026-09-23
      superseded_by: 2
      summary: >-
        v1 also held the criterion that a Plan generated, with an AI test double, for a
        Trip with no travel style, food preference or transportation carries Balanced,
        No Preference and Mixed. Moved unchanged to REQ-TRV-096 by CHG-0002, because
        it needs Plan generation and the transportation preference (slices 4 and 6),
        which slice 3 does not build.
  source: BRD v1.0 §6; §30 FR-02; §27; §25 Release 1; clarified by client confirmation relayed in session 2026-09-23; re-agreed after CHG-0002 by developer confirmation 2026-09-25
  acceptance:
    - given: >-
        A logged-in Traveler whose email address is confirmed, and an enabled
        Destination record Tokyo
      when: >-
        They create a Trip named "Tokyo Family Holiday", Destination Tokyo, start date
        2026-10-10, end date 2026-10-17, 2 adults, 2 children, budget 5000, currency USD
      then: >-
        The Trip appears in their list of Trips with exactly those values, and its
        number of travelers is shown as 4
    - given: No Destination record named Atlantis exists
      when: A Traveler tries to create a Trip with Destination Atlantis
      then: >-
        The Trip is not created and the Destination is named as the invalid field
    - given: Enabled Destination records Tokyo and Kyoto
      when: A Traveler types "Tok" into the Destination field of a new Trip
      then: Tokyo is offered for selection and Kyoto is not
    - given: A logged-in Traveler
      when: They submit a new Trip's details and no Plan has been generated
      then: The Trip appears in their list of Trips with status "Draft"
    - given: A logged-in Traveler
      when: >-
        They submit a Trip with one of trip name, Destination, start date, end date,
        number of adults, budget or currency left blank
      then: >-
        The Trip is not created and the blank field is named as the invalid field
    - given: A logged-in Traveler
      when: They submit a Trip with 0 adults
      then: >-
        The Trip is not created and the number of adults is named as the invalid field
    - given: A logged-in Traveler
      when: >-
        They submit an otherwise complete Trip with the number of children and every
        preference left blank
      then: The Trip is created with 0 children and no preferences
    - given: >-
        A Trip submitted through the Trip API with 2 adults, 1 child and a separately
        supplied number of travelers of 5
      when: The Trip is read back
      then: Its number of travelers is 3
    - given: A Traveler creating a Trip
      when: The budget field is shown
      then: >-
        Text beside it states that the budget is one total for the whole group, covering
        costs at the Destination only and excluding flights or other travel to and from
        the Destination
    - given: A Traveler creating a Trip
      when: They open the currency choice
      then: Exactly AUD, USD, EUR, GBP, JPY, SGD, NZD and BDT are offered
    - given: A logged-in Traveler
      when: They submit a Trip with currency "CAD" through the Trip API
      then: The Trip is not created and the currency is named as the invalid field
    - given: A Traveler whose profile default travel style is Family
      when: >-
        They create a Trip and change its travel style to Adventure before saving
      then: >-
        The Trip is saved with travel style Adventure and their profile still shows
        Family
  depends_on: [REQ-TRV-002]
  belts: [A, B, C]

- id: REQ-TRV-012
  title: A Trip whose end date is before its start date is refused
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/trips.spec.ts
    - tests/api/trips.http.spec.ts
    - tests/unit/trip-schemas.test.ts
    - tests/unit/trip-service.test.ts
  version: 2
  history:
    - version: 1
      agreed: 2026-09-23
      superseded_by: 2
      summary: >-
        v1 also held the criterion that, today being 2026-09-23, a saved Trip that ran
        from 2026-09-01 to 2026-09-05 opens showing the Trip and its Plan. Moved
        unchanged to REQ-TRV-097 by CHG-0002, because it needs a saved Plan (slice 5),
        which slice 3 does not build.
  source: BRD v1.0 §6 (start date, end date); glossary Day ("from the start date through the end date"); clarified by client confirmation relayed in session 2026-09-23; re-agreed after CHG-0002 by developer confirmation 2026-09-25
  acceptance:
    - given: A logged-in Traveler
      when: They submit a Trip with start date 2026-10-17 and end date 2026-10-10
      then: The Trip is not created and the end date is named as the invalid field
    - given: Today is 2026-09-23
      when: A Traveler submits a new Trip from 2026-10-01 to 2026-10-14 (14 Days)
      then: The Trip is created
    - given: Today is 2026-09-23
      when: A Traveler submits a new Trip from 2026-10-01 to 2026-10-15 (15 Days)
      then: The Trip is not created and the end date is named as the invalid field
    - given: Today is 2026-09-23
      when: A Traveler submits a new Trip starting 2026-09-22
      then: The Trip is not created and the start date is named as the invalid field
    - given: Today is 2026-09-23
      when: A Traveler submits a new Trip starting and ending on 2026-09-23
      then: The Trip is created as a 1-Day Trip
    - given: Today is 2026-09-23 and a saved Trip starts on 2026-10-10
      when: Its owner edits the start date to 2026-09-20
      then: >-
        The change is refused, the start date is named as the invalid field, and the
        Trip still starts on 2026-10-10
  depends_on: [REQ-TRV-011]
  belts: [A, B, C]

- id: REQ-TRV-013
  title: A Trip with a negative budget is refused
  module: TRV
  priority: must
  status: verified
  verified_by:
    - tests/api/trips.http.spec.ts
    - tests/unit/trip-schemas.test.ts
  version: 1
  source: BRD v1.0 §6 (budget); §11 (estimated total compared with budget)
  acceptance:
    - given: A logged-in Traveler
      when: They submit a Trip with budget -100
      then: The Trip is not created and the budget is named as the invalid field
  depends_on: [REQ-TRV-011]
  belts: [A, C]

- id: REQ-TRV-014
  title: A Traveler can edit the details of a saved Trip
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/trips.spec.ts
    - tests/api/trips.http.spec.ts
    - tests/unit/trip-service.test.ts
  version: 2
  history:
    - version: 1
      agreed: 2026-09-23
      superseded_by: 2
      summary: >-
        v1 also held seven criteria on editing a Trip that has a Plan: a Destination
        change warns, then regenerates the Plan; a date change drops Days (with a
        warning), keeps them, or shifts them, and offers to generate new Days; and a
        change to adults or budget leaves the Plan unchanged with a banner. Moved
        unchanged to REQ-TRV-098 by CHG-0002, because they need a saved Plan and
        regeneration (slices 5 and 7), which slice 3 does not build.
  source: BRD v1.0 §13 ("Users can edit, regenerate, delete and share saved itineraries"); §30 FR-02 ("Create and manage trips"); clarified by client confirmation relayed in session 2026-09-23; re-agreed after CHG-0002 by developer confirmation 2026-09-25
  acceptance:
    - given: A saved Trip named "Tokyo Family Holiday"
      when: Its owner changes the name to "Tokyo Autumn" and saves
      then: The Trip is listed as "Tokyo Autumn"
  depends_on: [REQ-TRV-011]
  belts: [A, B, C]

- id: REQ-TRV-015
  title: A Traveler can delete a saved Trip
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/trips.spec.ts
    - tests/api/trips.http.spec.ts
    - tests/unit/trip-service.test.ts
  version: 2
  history:
    - version: 1
      agreed: 2026-09-23
      superseded_by: 2
      summary: >-
        v1 also held three criteria: a Trip restored 10 days after deletion reappears
        with its Plan and chat; 31 days after deletion no Trip, Plan or chat record
        remains and no restore is offered; and feedback on a permanently deleted Trip
        is kept, anonymised. Moved unchanged by CHG-0002, the first two to
        REQ-TRV-099 (slice 8) and the third to REQ-TRV-100 (slice 12), because they
        need Plans, chat and feedback, which slice 3 does not build.
  source: BRD v1.0 §13 ("Users can edit, regenerate, delete and share saved itineraries"); §30 FR-02; clarified by client confirmation relayed in session 2026-09-23; re-agreed after CHG-0002 by developer confirmation 2026-09-25
  acceptance:
    - given: A Traveler with a saved Trip
      when: They delete it
      then: The Trip no longer appears in their list of Trips
  depends_on: [REQ-TRV-011]
  belts: [A, B, C]

- id: REQ-TRV-016
  title: A Traveler can see a list of their saved Trips
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/trips.spec.ts
    - tests/api/trips.http.spec.ts
    - tests/unit/trip-service.test.ts
  version: 1
  source: BRD v1.0 §13 ("Users can save generated trips and reopen them later"); §30 FR-08; §25 Release 1
  acceptance:
    - given: A Traveler who has saved two Trips
      when: They open their list of Trips
      then: Both Trips are listed by name
  depends_on: [REQ-TRV-011]
  belts: [A, B, C]

- id: REQ-TRV-017
  title: A Traveler can save a Trip together with its generated Plan
  module: TRV
  priority: must
  status: verified
  verified_by:
    - e2e/save-reopen.spec.ts
    - tests/api/plan-versions.http.spec.ts
