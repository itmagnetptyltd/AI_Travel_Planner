id: CHG-0001
raised: 2026-09-24
stream: discovered_constraint
source: "Developer (Kartik Chandra Biswas), /tdd session 2026-09-24, choosing option (b) from the slice 2 plan"
raw: "(b) Split with /change-record (Recommended)"
context: >-
  Planning slice 2 (Admin and Destinations) found that 9 of its 28 acceptance
  criteria can only be tested once later slices exist: Trips and soft delete
  (slice 3), Plan generation (slice 4), Plan regeneration (slice 7) and Trip
  reminders (slice 11). The build order in slices.yaml, not the client, is what
  changed. Left as they were, those requirements could only reach `verified`
  with criteria untested, or would hold slice 2 open until slice 11 while the
  gate blocks slice 3. The developer chose to split them, so every requirement
  lands whole in one slice. No criterion's wording changes: each is moved word
  for word to a new requirement.
affects: [REQ-TRV-068, REQ-TRV-071, REQ-TRV-072, REQ-TRV-074, REQ-TRV-075, REQ-TRV-078]
creates: [REQ-TRV-091, REQ-TRV-092, REQ-TRV-093, REQ-TRV-094, REQ-TRV-095]
moves:
  - from: REQ-TRV-068 v1 criterion 9 (daily Plan generation limit)
    to: REQ-TRV-091
    slice: 4
  - from: REQ-TRV-071 v1 criterion 3 (no reminder email to a disabled Traveler)
    to: REQ-TRV-092
    slice: 11
  - from: REQ-TRV-072 v1 criterion 2 (Trip form offers enabled Kyoto)
    to: REQ-TRV-093
