id: CHG-0002
raised: 2026-09-25
stream: discovered_constraint
source: "Developer (Kartik Chandra Biswas), session 2026-09-25: invoked /change-record after the slice 3 plan offered option (b)"
raw: "/change-record"
context: >-
  Planning slice 3 (Trips) found that 13 of its acceptance criteria can only be
  tested once later slices exist. They need Plan generation (slice 4), a saved
  Plan (slice 5), the transportation preference (slice 6), regeneration
  (slice 7), chat (slice 8), and feedback plus the admin view of Trips
  (slice 12). As with CHG-0001, what changed is the build order in
  slices.yaml, not the client's scope. Left as they were, REQ-TRV-007, 011,
  012, 014 and 015 would either reach `verified` with criteria untested, or
  hold slice 3 open while the slice gate blocks slice 4. Every criterion moves
  word for word to a new requirement in the slice that can test it. No
  criterion's wording changes.
affects: [REQ-TRV-007, REQ-TRV-011, REQ-TRV-012, REQ-TRV-014, REQ-TRV-015]
creates: [REQ-TRV-096, REQ-TRV-097, REQ-TRV-098, REQ-TRV-099, REQ-TRV-100, REQ-TRV-101]
moves:
  - from: REQ-TRV-011 v1 criterion 8 (default travel style, food preference and transportation reach the AI)
    to: REQ-TRV-096
    slice: 6
  - from: REQ-TRV-012 v1 criterion 6 (a past Trip opens with its Plan)
    to: REQ-TRV-097
    slice: 5
  - from: REQ-TRV-014 v1 criteria 2 to 8 (changing Destination, dates, adults or budget of a Trip that has a Plan)
    to: REQ-TRV-098
    slice: 7
  - from: REQ-TRV-015 v1 criteria 2 and 3 (restore within 30 days with Plan and chat; permanent deletion after 30 days)
    to: REQ-TRV-099
    slice: 8
  - from: REQ-TRV-015 v1 criterion 4 (feedback kept, anonymised, after permanent deletion)
    to: REQ-TRV-100
    slice: 12
  - from: REQ-TRV-007 v1 criterion 5 (an Administrator sees a Trip's summary without Days or Activities)
    to: REQ-TRV-101
    slice: 12
